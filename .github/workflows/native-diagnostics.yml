name: Native diagnostic tests
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Swift test class or regular expression
        required: true
        default: IncrementalPaginationTests
      profile:
        description: Sample BudgetedPaginationTests for main-thread stalls
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Run targeted native regressions
        env:
          SCRIBE_SCHEMA_OUTPUT: build/schema
          TEST_FILTER: ${{ inputs.test_filter }}
          PROFILE: ${{ inputs.profile }}
          SCRIBE_PROFILE_NATIVE: ${{ inputs.profile }}
        run: |
          swift build --build-tests --sanitize=address
          mkdir -p build/schema
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          log = open('build/schema/FormattingASAN.log', 'w')
          env = dict(os.environ, ASAN_OPTIONS='detect_leaks=0:halt_on_error=1')
          process = subprocess.Popen(['swift', 'test', '--sanitize=address', '--skip-build', '--filter', os.environ['TEST_FILTER']], stdout=log, stderr=subprocess.STDOUT, env=env)
          try:
              code = process.wait(timeout=240)
          except subprocess.TimeoutExpired:
              pids = subprocess.run(['pgrep', '-f', 'ScribePackageTests'], capture_output=True, text=True).stdout.split()
              for pid in pids:
                  subprocess.run(['sample', pid, '3', '1', '-file', 'build/schema/ASAN-' + pid + '.txt'], timeout=20)
              process.terminate()
              code = 124
          log.close()
          print(pathlib.Path('build/schema/FormattingASAN.log').read_text())
          raise SystemExit(code)
          PYCODE
      - name: Diagnose failed targeted tests with Objective-C zombies
        if: false
        env:
          NSZombieEnabled: "YES"
          SCRIBE_SCHEMA_OUTPUT: build/schema
          TEST_FILTER: ${{ inputs.test_filter }}
        run: swift test --skip-build --filter "$TEST_FILTER"
      - name: Retain native crash reports
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          import time
          time.sleep(2)
          sources = [Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')]
          destination = Path('build/schema/diagnostics')
          destination.mkdir(parents=True, exist_ok=True)
          for source in sources:
              for path in source.rglob('*'):
                  if path.is_file() and any(name in path.name.lower() for name in ('scribe', 'xctest', 'swift')):
                      shutil.copy2(path, destination / path.name)
          PYCODE
      - name: Retain rendered diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-diagnostics
          path: build/schema
          if-no-files-found: ignore
          retention-days: 14

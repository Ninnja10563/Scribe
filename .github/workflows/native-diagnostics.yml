name: Native diagnostic tests
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Swift test class or regular expression
        required: true
        default: IncrementalPaginationTests
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Run targeted native regressions
        env:
          SCRIBE_SCHEMA_OUTPUT: build/schema
          TEST_FILTER: ${{ inputs.test_filter }}
        run: swift test --filter "$TEST_FILTER"
      - name: Retain rendered diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-diagnostics
          path: build/schema
          if-no-files-found: ignore
          retention-days: 14

name: Native diagnostic tests
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Swift test class or regular expression
        required: true
        default: IncrementalPaginationTests
      profile:
        description: Sample the native test process for main-thread stalls
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Run targeted native regressions
        env:
          SCRIBE_SCHEMA_OUTPUT: build/schema
          TEST_FILTER: ${{ inputs.test_filter }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" != "true" ]; then
            swift test --filter "$TEST_FILTER"
            exit
          fi
          swift build --build-tests
          mkdir -p build/schema
          swift test --skip-build --filter "$TEST_FILTER" &
          test_runner=$!
          # SwiftPM briefly launches a separate XCTest discovery process.
          sleep 1
          for attempt in $(seq 1 100); do
            test_pid=$(pgrep -n -f '[/]ScribePackageTests.xctest' || true)
            if [ -n "$test_pid" ]; then
              sample "$test_pid" 10 1 -file build/schema/NativeProcessSample.txt || true
              break
            fi
            if ! kill -0 "$test_runner" 2>/dev/null; then break; fi
            sleep 0.1
          done
          wait "$test_runner"
          test -s build/schema/NativeProcessSample.txt
      - name: Retain rendered diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-diagnostics
          path: build/schema
          if-no-files-found: ignore
          retention-days: 14

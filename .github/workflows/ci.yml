name: Build and test Scribe
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test core, interoperability and native editor
        run: swift test --parallel
      - name: Build Apple Silicon application and DMG
        run: ./scripts/build-dmg.sh
      - name: Launch, paginate, save, export and render
        env:
          SCRIBE_SMOKE_OUTPUT: build/smoke
        run: build/Scribe.app/Contents/MacOS/Scribe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Scribe-arm64
          path: |
            build/*.dmg
            build/*.sha256
            build/smoke/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Scribe-arm64
          path: build
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg build/*.sha256 --title "Scribe $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease --verify-tag

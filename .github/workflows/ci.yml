name: Build and test Scribe
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Toolchain
        run: swift --version
      - name: Test core, interoperability and native editor
        env:
          SCRIBE_SCHEMA_OUTPUT: build/schema
        run: swift test
      - name: Recheck native window and dialog lifecycle
        run: |
          for attempt in 1 2 3; do
            swift test --skip-build --filter 'ScribeTests'
          done
      - name: Check native memory lifetime with Address Sanitizer
        if: always()
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          swift test --sanitize=address --scratch-path .build-asan --filter ScribeTests
          for attempt in 1 2; do
            swift test --sanitize=address --scratch-path .build-asan --skip-build --filter ScribeTests
          done
      - name: Diagnose failed native tests with Objective-C zombies
        if: failure()
        env:
          NSZombieEnabled: "YES"
        run: |
          if test -d .build/debug/ScribePackageTests.xctest; then
            swift test --skip-build
          fi
      - name: Retain native crash reports
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          import time
          time.sleep(2)
          sources = [Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')]
          destination = Path('build/schema/diagnostics')
          destination.mkdir(parents=True, exist_ok=True)
          for source in sources:
              for path in source.rglob('*'):
                  if path.is_file() and any(name in path.name.lower() for name in ('scribe', 'xctest', 'swift')):
                      shutil.copy2(path, destination / path.name)
          PYCODE
      - name: Retain test export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-exports
          path: build/schema/
          if-no-files-found: ignore
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
      - name: Build Apple Silicon application and DMG
        run: ./scripts/build-dmg.sh
      - name: Launch, paginate, save, export and render
        env:
          SCRIBE_SMOKE_OUTPUT: build/smoke
        run: python3 scripts/native-smoke.py build/Scribe.app/Contents/MacOS/Scribe
      - name: Retain native launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-smoke
          path: build/smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Scribe-arm64
          path: |
            build/*.dmg
            build/*.sha256
            build/smoke/
            build/schema/
  office-validation:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Scribe-arm64
          path: build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore independent Office XML validator
        run: dotnet restore tools/OOXMLValidation --locked-mode
      - name: Validate the release app's DOCX package
        run: dotnet run --project tools/OOXMLValidation --no-restore -- build/smoke/*.docx build/schema/*.docx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF and Word readers
        run: python -m pip install -r tools/requirements-validation.txt
      - name: Verify rendered PDF and Word smoke output
        run: python scripts/verify-smoke.py build/smoke
      - name: Verify budgeted pagination output
        run: python scripts/verify-budgeted-layout.py build/schema
      - name: Verify rich paste review output
        run: python scripts/verify-review-paste.py build/schema
      - name: Verify screen-only revision drawing
        run: python scripts/verify-review-drawing.py build/schema
      - name: Verify review PDF output modes
        run: python scripts/verify-review-output.py build/schema
      - name: Verify note draft object output
        run: python scripts/verify-note-draft-objects.py build/schema
      - name: Verify native list editing output
        run: python scripts/verify-list-editing.py build/schema
      - name: Verify tracked note dialog output
        run: python scripts/verify-tracked-note-dialog.py build/schema
      - name: Verify structural review markers
        run: python scripts/verify-structural-review.py build/schema
      - name: Install independent Office renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math fonts-liberation
          libreoffice --version
      - name: Render DOCX exports in LibreOffice
        run: python scripts/verify-office-render.py build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Office-render
          path: |
            build/office-render/*.pdf
            build/office-render/*.png
            build/office-render/*.json
            build/office-render/*.log
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, office-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Scribe-arm64
          path: build
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg build/*.sha256 --title "Scribe $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease --verify-tag
